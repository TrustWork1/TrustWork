[tool.poetry]
name = "trustwork-backend"
version = "0.1.0"
description = "Django REST backend for the TrustWork platform, including users, projects, profiles, content, chat, admin, and payment workflows."
authors = ["Somnath Singha <somnath.singha@webskitters.com>"]
readme = "README.md"
package-mode = true
packages = [
    { include = "adminsite_management" },
    { include = "api" },
    { include = "chat_management" },
    { include = "content_management" },
    { include = "core" },
    { include = "customuser" },
    { include = "master" },
    { include = "payment_handle" },
    { include = "profile_management" },
    { include = "project_management" },
]

[tool.poetry.dependencies]
python = "^3.12"
basicauth = "^1.0.0"
channels = "^4.2.0"
channels-redis = "^4.2.1"
daphne = "^4.1.2"
dj-stripe = "^2.9.0"
django = "^4.1.1"
django-cors-headers = "^4.4.0"
django-csp = "^4.0"
django-environ = "^0.11.2"
django-rest-swagger = "^2.2.0"
djangorestframework = "^3.15.2"
drf-yasg = "^1.21.8"
firebase-admin = "^6.6.0"
geopy = "^2.4.1"
pillow = "^10.4.0"
psycopg = "^3.3.3"
psycopg2-binary = "^2.9.9"
pyclean = "^3.1.0"
pycountry = "^24.6.1"
requests = "^2.32.3"
stripe = "^11.4.1"
twilio = "^9.4.5"
uvicorn = "^0.34.0"
websockets = "^14.1"
whitenoise = "^6.9.0"
reportlab = "^4.5.1"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
ruff = "^0.8.4"

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
/(
    migrations
  | staticfiles
  | media
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    "migrations",
    "staticfiles",
    "media",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
